name: Opportunity Crawler & Alert Monitor

on:
  schedule:
    # Run daily at 08:00 UTC (09:00 WAT)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  crawl-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Crawler & Check Immediate Alerts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'Pre-University System <onboarding@resend.dev>' }}
          STUDENT_EMAIL: ${{ secrets.STUDENT_EMAIL || 'lara@example.com' }}
          PARENT_EMAIL: ${{ secrets.PARENT_EMAIL || 'parent@example.com' }}
        run: |
          python3 -m preuni_system.cli seed
          python3 -m preuni_system.cli scan
          python3 -m preuni_system.cli alert --send
