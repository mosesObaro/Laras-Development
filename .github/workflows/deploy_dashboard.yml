name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - 'data/**'
  schedule:
    # Daily 03:37 UTC (04:37 WAT): refresh this week's email previews and calendar content
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      STUDENT_LEVEL: ${{ vars.STUDENT_LEVEL || 'pre-university' }}
      START_DATE: ${{ vars.START_DATE || '2026-09-01' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Bundled Dashboard Data & Email Previews
        run: |
          python3 -m preuni_system.bundle_dashboard

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
