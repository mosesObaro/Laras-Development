name: Opportunity Crawler & Alert Monitor

on:
  schedule:
    # 05:47 UTC (06:47 WAT). Off-the-hour times start sooner;
    # GitHub can still delay scheduled runs at busy times.
    - cron: '47 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  crawl-and-alert:
    runs-on: ubuntu-latest
    env:
      STUDENT_LEVEL: ${{ vars.STUDENT_LEVEL || 'pre-university' }}
      START_DATE: ${{ vars.START_DATE || '2026-09-01' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Keeps the record of alerts already sent so each opportunity is alerted only once
      - name: Restore Database from Previous Run
        uses: actions/cache/restore@v4
        with:
          path: preuni_system.sqlite3
          key: preuni-db-alert-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: preuni-db-alert-

      - name: Run Crawler & Check Immediate Alerts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'Pre-University System <onboarding@resend.dev>' }}
          STUDENT_EMAIL: ${{ secrets.STUDENT_EMAIL || 'lara@example.com' }}
          PARENT_EMAIL: ${{ secrets.PARENT_EMAIL || 'parent@example.com' }}
        run: |
          python3 -m preuni_system.cli seed
          python3 -m preuni_system.cli scan
          python3 -m preuni_system.cli alert --send

      - name: Save Database for the Next Run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: preuni_system.sqlite3
          key: preuni-db-alert-${{ github.run_id }}-${{ github.run_attempt }}
