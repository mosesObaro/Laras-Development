name: Daily Personalized Learning & Opportunity Alert

on:
  schedule:
    # 04:17 UTC (05:17 West Africa Time / WAT). Off-the-hour times start sooner;
    # GitHub can still delay scheduled runs at busy times.
    - cron: '17 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  send-daily-alert:
    runs-on: ubuntu-latest
    env:
      STUDENT_NAME: ${{ vars.STUDENT_NAME || 'Lara' }}
      STUDENT_LEVEL: ${{ vars.STUDENT_LEVEL || 'pre-university' }}
      START_DATE: ${{ vars.START_DATE || '2026-09-01' }}
      DAILY_ALERT_ENABLED: ${{ vars.DAILY_ALERT_ENABLED || 'true' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Keeps alert history between runs so the same recommendations are not re-sent
      - name: Restore Database from Previous Run
        uses: actions/cache/restore@v4
        with:
          path: preuni_system.sqlite3
          key: preuni-db-daily-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: preuni-db-daily-

      - name: Seed Database & Ingest Live Opportunity Feeds
        run: |
          python3 -m preuni_system.cli seed
          python3 -m preuni_system.cli scan

      - name: Generate & Dispatch Daily Learning Alert via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'Pre-University System <onboarding@resend.dev>' }}
          STUDENT_EMAIL: ${{ secrets.STUDENT_EMAIL || 'lara@example.com' }}
          PARENT_EMAIL: ${{ secrets.PARENT_EMAIL || 'parent@example.com' }}
        run: |
          python3 -m preuni_system.cli daily-alert --send

      - name: Save Database for the Next Run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: preuni_system.sqlite3
          key: preuni-db-daily-${{ github.run_id }}-${{ github.run_attempt }}
